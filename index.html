<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>대한민국 슈퍼 경찰 백시윤 - 전술 통제 패널</title>
    <style>
        :root {
            --bg: #050505;
            --panel: #1a1a1a;
            --blue: #0080ff;
            --red: #ff0000;
            --green: #00ff41;
            --gold: #ffd700;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg);
            background-image: linear-gradient(0deg, #111 1px, transparent 1px), linear-gradient(90deg, #111 1px, transparent 1px);
            background-size: 30px 30px;
            color: #eee; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            overflow: hidden; height: 100vh; display: flex; flex-direction: column;
        }

        /* 부팅 화면 */
        #boot-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 1000; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        .start-btn {
            background: #111; color: var(--gold); border: 2px solid var(--gold);
            padding: 30px 60px; font-size: 2.5rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3); letter-spacing: 5px;
            border-radius: 10px;
        }

        /* 상단 타이틀 구역 */
        .header {
            text-align: center; padding: 20px; background: #000;
            border-bottom: 4px solid var(--gold);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.2);
        }
        .header h1 {
            margin: 0; font-size: 3.5rem; color: var(--gold);
            text-shadow: 2px 2px 0px #333, 0 0 15px rgba(255, 215, 0, 0.6);
            font-weight: 900; letter-spacing: 2px;
        }

        /* 경광등 애니메이션 바 */
        .light-bar { display: flex; height: 15px; width: 100%; background: #000; }
        .unit { flex: 1; border: 0.5px solid #111; opacity: 0.1; }

        /* 메인 그리드 */
        .dashboard {
            flex: 1; display: grid; grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(2, 1fr); gap: 15px; padding: 20px;
        }

        /* 택티컬 버튼 */
        .btn {
            background: linear-gradient(145deg, #222, #0a0a0a);
            border: 1px solid #333; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.1s; position: relative;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.8);
        }
        .btn:active { transform: scale(0.95); background: #333; }
        .btn .label { font-size: 1.4rem; font-weight: bold; color: #bbb; margin-top: 10px; }
        .btn .sub { font-size: 0.7rem; color: #555; margin-top: 5px; text-transform: uppercase; }

        /* 상태 LED */
        .led { width: 50px; height: 6px; border-radius: 3px; background: #222; margin-bottom: 10px; }
        .active-blue .led { background: var(--blue); box-shadow: 0 0 15px var(--blue); }
        .active-red .led { background: var(--red); box-shadow: 0 0 15px var(--red); }
        .active-green .led { background: var(--green); box-shadow: 0 0 15px var(--green); }

        /* HUD 메시지 */
        #hud {
            height: 60px; background: #000; border-top: 1px solid #222;
            display: flex; align-items: center; padding: 0 30px;
            color: var(--green); font-family: monospace; font-size: 1.2rem;
        }

        /* 레이더 */
        #radar {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 300px; height: 300px; border: 2px solid #004400;
            border-radius: 50%; background: rgba(0, 20, 0, 0.9); display: none;
        }
        .sweep {
            width: 100%; height: 100%; border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 80%, rgba(0, 255, 0, 0.4) 100%);
            animation: sweep 2s linear infinite;
        }
        @keyframes sweep { to { transform: rotate(360deg); } }

        .night-vision { filter: brightness(0.8) sepia(100%) hue-rotate(80deg) contrast(1.5); }
        @keyframes shake { 0% {transform:translate(2px,2px)} 50% {transform:translate(-2px,-2px)} 100% {transform:translate(2px,2px)} }
    </style>
</head>
<body>

<div id="boot-screen">
    <h1 style="color:white; margin-bottom:40px;">POLICE SYSTEM V9.0</h1>
    <button class="start-btn" onclick="startSystem()">시스템 시작</button>
</div>

<div class="light-bar">
    <div class="unit"></div><div class="unit"></div><div class="unit"></div><div class="unit"></div>
    <div class="unit"></div><div class="unit"></div><div class="unit"></div><div class="unit"></div>
</div>

<header class="header">
    <h1>대한민국 슈퍼 경찰 백시윤</h1>
</header>

<div class="dashboard">
    <div class="btn" onclick="dispatch()">
        <div class="led"></div>
        <div class="label">긴급 출동</div>
        <div class="sub">Dispatch Unit</div>
    </div>
    <div class="btn" id="l-btn" onclick="toggleLights()">
        <div class="led"></div>
        <div class="label">경광등</div>
        <div class="sub">Emergency Lights</div>
    </div>
    <div class="btn" id="s-btn" onclick="toggleSiren()">
        <div class="led"></div>
        <div class="label">사이렌</div>
        <div class="sub">Siren System</div>
    </div>
    <div class="btn" onclick="scan()">
        <div class="led"></div>
        <div class="label">범인 스캔</div>
        <div class="sub">Target Scan</div>
    </div>
    <div class="btn" id="b-btn" onclick="booster()">
        <div class="led"></div>
        <div class="label">부스터</div>
        <div class="sub">N2O Boost</div>
    </div>
    <div class="btn" onclick="radio()">
        <div class="led"></div>
        <div class="label">무전기</div>
        <div class="sub">Radio Comms</div>
    </div>
    <div class="btn" onclick="hq()">
        <div class="led"></div>
        <div class="label">본부 연결</div>
        <div class="sub">HQ Link</div>
    </div>
    <div class="btn" id="n-btn" onclick="nightVision()">
        <div class="led"></div>
        <div class="label">야간 모드</div>
        <div class="sub">Night Vision</div>
    </div>
    <div class="btn" onclick="emergencyStop()">
        <div class="led"></div>
        <div class="label">긴급 정지</div>
        <div class="sub">System Brake</div>
    </div>
    <div class="btn" onclick="missionEnd()">
        <div class="led"></div>
        <div class="label">임무 완료</div>
        <div class="sub">Mission End</div>
    </div>
</div>

<div id="hud">SYSTEM READY...</div>
<div id="radar"><div class="sweep"></div></div>

<script>
    let aCtx, lightInterval;
    let sirenOsc = null;
    let sirenGain = null;
    let sirenType = 0; // 0:Off, 1:Wail, 2:Yelp, 3:HiLo
    let lightsOn = false;
    let maleVoice = null;

    // 1. 남성 목소리 엔진 최적화
    function loadVoices() {
        const voices = window.speechSynthesis.getVoices();
        // 한국어 남성 목소리 탐색 (민준, Google 남성, 대호 등)
        maleVoice = voices.find(v => v.lang.includes('ko') && (v.name.includes('Male') || v.name.includes('남성') || v.name.includes('민준') || v.name.includes('대호')));
        if (!maleVoice) {
            maleVoice = voices.find(v => v.lang.includes('ko')); // 남성 엔진 없으면 일반 한국어라도 사용
        }
    }
    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    function speak(text) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ko-KR';
        if (maleVoice) msg.voice = maleVoice;
        
        // 자연스러운 남성톤을 위해 미세 조정 (억지스럽지 않게)
        msg.pitch = maleVoice && maleVoice.name.includes('Male') ? 1.0 : 0.85; 
        msg.rate = 0.95; 
        window.speechSynthesis.speak(msg);
    }

    // 2. 현실적인 사이렌 주파수 제어 (Web Audio API)
    function stopSiren() {
        if (sirenOsc) {
            sirenOsc.stop();
            sirenOsc.disconnect();
            sirenOsc = null;
        }
        if (sirenGain) {
            sirenGain.disconnect();
            sirenGain = null;
        }
    }

    function playSiren(type) {
        stopSiren();
        if (type === 0) return;

        aCtx.resume();
        sirenOsc = aCtx.createOscillator();
        sirenGain = aCtx.createGain();
        sirenOsc.type = 'triangle'; // 실제 사이렌 스피커와 유사한 배음
        
        sirenGain.gain.setValueAtTime(0.1, aCtx.currentTime);
        sirenOsc.connect(sirenGain);
        sirenGain.connect(aCtx.destination);

        const now = aCtx.currentTime;

        if (type === 1) { // WAIL: 긴 호흡의 한국 경찰 사이렌
            const cycle = 4.0; 
            const freq = sirenOsc.frequency;
            freq.setValueAtTime(400, now);
            for(let i=0; i<100; i++) {
                freq.exponentialRampToValueAtTime(1100, now + (i*cycle) + (cycle/2));
                freq.exponentialRampToValueAtTime(400, now + (i*cycle) + cycle);
            }
        } else if (type === 2) { // YELP: 급박한 빠른 사이렌
            const cycle = 0.5;
            const freq = sirenOsc.frequency;
            freq.setValueAtTime(500, now);
            for(let i=0; i<200; i++) {
                freq.exponentialRampToValueAtTime(1200, now + (i*cycle) + (cycle/2));
                freq.exponentialRampToValueAtTime(500, now + (i*cycle) + cycle);
            }
        } else if (type === 3) { // HI-LO: 고저음 경보
            const cycle = 0.8;
            const freq = sirenOsc.frequency;
            for(let i=0; i<100; i++) {
                freq.setValueAtTime(900, now + (i*cycle));
                freq.setValueAtTime(600, now + (i*cycle) + (cycle/2));
            }
        }
        
        sirenOsc.start();
    }

    function haptic(ms) { if (navigator.vibrate) navigator.vibrate(ms); }
    function setHud(text) { document.getElementById('hud').innerText = "STATUS: " + text; }

    function startSystem() {
        aCtx = new (window.AudioContext || window.webkitAudioContext)();
        document.getElementById('boot-screen').style.display = 'none';
        speak("시스템 가동. 백시윤 경관님, 환영합니다.");
        setHud("POLICE TACTICAL SYSTEM ONLINE");
    }

    function dispatch() {
        haptic([100, 50, 100]);
        speak("현 시각 부로 코드 3 긴급 상황 발생. 백시윤 경관님, 현장으로 출동하십시오.");
        setHud("CODE 3 DISPATCH - IMMEDIATE RESPONSE");
    }

    function toggleLights() {
        const btn = document.getElementById('l-btn');
        lightsOn = !lightsOn;
        haptic(50);
        if (lightsOn) {
            btn.classList.add('active-red');
            lightInterval = setInterval(() => {
                const units = document.querySelectorAll('.unit');
                const phase = Math.floor(Date.now() / 80) % 2;
                units.forEach((u, i) => {
                    const isLeft = i < 4;
                    u.style.opacity = (phase === 0 && isLeft) || (phase === 1 && !isLeft) ? "1" : "0.1";
                    u.style.backgroundColor = isLeft ? "blue" : "red";
                    u.style.boxShadow = u.style.opacity === "1" ? `0 0 20px ${u.style.backgroundColor}` : "none";
                });
            }, 80);
        } else {
            btn.classList.remove('active-red');
            clearInterval(lightInterval);
            document.querySelectorAll('.unit').forEach(u => u.style.opacity = "0.1");
        }
    }

    function toggleSiren() {
        const btn = document.getElementById('s-btn');
        sirenType = (sirenType + 1) % 4;
        haptic(50);
        
        if (sirenType === 0) { 
            btn.classList.remove('active-blue'); 
            stopSiren();
            setHud("SIREN SYSTEM STANDBY"); 
            return; 
        }
        
        btn.classList.add('active-blue');
        const modes = ["", "WAIL", "YELP", "HI-LO"];
        setHud("SIREN ACTIVE: " + modes[sirenType]);
        playSiren(sirenType);
    }

    function scan() {
        const r = document.getElementById('radar');
        r.style.display = 'block';
        haptic([40, 40, 40]);
        setHud("AREA SCANNING...");
        setTimeout(() => {
            r.style.display = 'none';
            speak("범인 포착. 10시 방향 용의 차량이 발견되었습니다.");
            setHud("TARGET ACQUIRED - TRACKING START");
        }, 3000);
    }

    function booster() {
        haptic(1000);
        speak("부스터 가동. 엔진 최대 출력.");
        document.body.style.animation = "shake 0.1s infinite";
        document.getElementById('b-btn').classList.add('active-green');
        
        // 부스터 소리
        const osc = aCtx.createOscillator();
        const g = aCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(50, aCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, aCtx.currentTime + 2);
        g.gain.setValueAtTime(0.05, aCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, aCtx.currentTime + 2);
        osc.connect(g); g.connect(aCtx.destination);
        osc.start(); osc.stop(aCtx.currentTime + 2);

        setTimeout(() => {
            document.body.style.animation = "";
            document.getElementById('b-btn').classList.remove('active-green');
        }, 2000);
    }

    function radio() {
        haptic(50);
        const b = aCtx.createBuffer(1, aCtx.sampleRate * 0.15, aCtx.sampleRate);
        const d = b.getChannelData(0);
        for(let i=0; i<d.length; i++) d[i] = Math.random() * 0.1;
        const s = aCtx.createBufferSource(); s.buffer = b;
        s.connect(aCtx.destination); s.start();
        setTimeout(() => speak("본부 나와라. 여기는 백시윤 경관. 용의자를 추격 중이다. 지원 바람. 오버."), 200);
    }

    function hq() {
        speak("현재 상황 보고합니다. 시내 순찰 중 특이사항 없음. 이상.");
        setHud("ENCRYPTED HQ LINK ACTIVE");
    }

    function nightVision() {
        document.body.classList.toggle('night-vision');
        const active = document.body.classList.contains('night-vision');
        document.getElementById('n-btn').classList.toggle('active-green', active);
        speak(active ? "야간 투시경 가동." : "표준 시야 모드 전환.");
    }

    function emergencyStop() {
        haptic([100, 50, 100, 50, 800]);
        speak("긴급 정지! 전 시스템 브레이크 작동!");
        sirenType = 0; stopSiren();
        document.getElementById('s-btn').classList.remove('active-blue');
        setHud("EMERGENCY BRAKE ENGAGED");
    }

    function missionEnd() {
        speak("오늘도 고생하셨습니다, 백시윤 경관님. 오늘도 평화로운 하루입니다. 작전 종료.");
        setHud("MISSION SUCCESSFUL - UNIT RETURNING");
        haptic([100, 100, 500]);
    }

    const st = document.createElement('style');
    st.innerHTML = `@keyframes shake { 0%{transform:translate(2px,2px)} 50%{transform:translate(-2px,-2px)} 100%{transform:translate(2px,2px)} }`;
    document.head.appendChild(st);
</script>
</body>
</html>
